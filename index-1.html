<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripWriter — 여행 블로그 자동생성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e0c;
    --panel:#121713;
    --panel-2:#161d18;
    --border:#212b23;
    --mint:#00d97e;
    --mint-dim:#0a3324;
    --text:#eef2ef;
    --text-dim:#8a978e;
    --text-faint:#586158;
    --danger:#ff6b6b;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% -10%, rgba(0,217,126,0.10), transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(0,217,126,0.05), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR', system-ui, sans-serif;
    min-height:100vh;
    padding:28px 16px 80px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  /* header */
  .header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:22px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg,var(--mint),#00a862);
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-weight:700;color:#04140c;font-size:15px;
    flex-shrink:0;
  }
  .brand-text h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-0.2px;}
  .brand-text p{font-size:11px;margin:2px 0 0;color:var(--text-faint);font-family:'JetBrains Mono',monospace;letter-spacing:0.3px;}
  .settings-btn{
    background:var(--panel);border:1px solid var(--border);color:var(--text-dim);
    width:38px;height:38px;border-radius:10px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:16px;
    transition:.15s;
  }
  .settings-btn:hover{color:var(--mint);border-color:var(--mint-dim);}

  /* settings panel */
  .settings{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:16px;display:none;
  }
  .settings.open{display:block;}
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block;font-size:11px;font-family:'JetBrains Mono',monospace;
    color:var(--text-faint);letter-spacing:0.5px;margin-bottom:6px;text-transform:uppercase;
  }
  .field input{
    width:100%;background:var(--panel-2);border:1px solid var(--border);
    border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;
    font-family:'JetBrains Mono',monospace;
  }
  .field input:focus{outline:none;border-color:var(--mint);}
  .field .hint{font-size:11px;color:var(--text-faint);margin-top:5px;line-height:1.5;}
  .field .hint a{color:var(--mint);text-decoration:none;}

  /* input card */
  .input-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;margin-bottom:20px;display:flex;gap:10px;
  }
  .input-card input{
    flex:1;background:var(--panel-2);border:1px solid var(--border);
    border-radius:10px;padding:13px 14px;color:var(--text);font-size:15px;
    font-family:'Noto Sans KR',sans-serif;
  }
  .input-card input:focus{outline:none;border-color:var(--mint);}
  .input-card input::placeholder{color:var(--text-faint);}
  .go-btn{
    background:var(--mint);color:#04140c;border:none;border-radius:10px;
    padding:0 20px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;
    transition:.15s;
  }
  .go-btn:hover{background:#00c473;}
  .go-btn:disabled{background:var(--panel-2);color:var(--text-faint);cursor:not-allowed;}

  /* status */
  .status{
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mint);
    margin:-6px 0 18px;padding-left:4px;min-height:16px;letter-spacing:0.3px;
    display:flex;align-items:center;gap:8px;
  }
  .status.error{color:var(--danger);}
  .spinner{
    width:11px;height:11px;border-radius:50%;
    border:2px solid rgba(0,217,126,0.25);border-top-color:var(--mint);
    animation:spin .7s linear infinite;flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* stage card */
  .stage{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:16px;overflow:hidden;
  }
  .stage-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;border-bottom:1px solid var(--border);
  }
  .stage-head-left{display:flex;align-items:center;gap:12px;}
  .num-badge{
    width:26px;height:26px;border-radius:50%;background:var(--mint-dim);
    border:1px solid rgba(0,217,126,0.3);color:var(--mint);
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;flex-shrink:0;
  }
  .stage-title{font-size:14px;font-weight:700;}
  .char-count{font-size:11px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}

  .stage-img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--panel-2);display:block;}
  .img-link-row{
    display:flex;align-items:center;gap:8px;padding:10px 18px;
    border-bottom:1px solid var(--border);background:var(--panel-2);
  }
  .img-link-row input{
    flex:1;background:transparent;border:none;color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 0;
  }
  .img-link-row input:focus{outline:none;}

  .section-label{
    font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);
    letter-spacing:1px;text-transform:uppercase;padding:14px 18px 0;
  }
  .body-box{
    margin:8px 18px 16px;background:var(--panel-2);border:1px solid var(--border);
    border-radius:10px;padding:14px 16px;font-size:13.5px;line-height:1.75;
    color:var(--text);white-space:pre-wrap;word-break:keep-all;
  }
  .copy-row{display:flex;justify-content:flex-end;margin:0 18px 16px;gap:8px;}
  .copy-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);
    padding:7px 13px;border-radius:8px;font-size:11.5px;cursor:pointer;
    font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:6px;
    transition:.15s;
  }
  .copy-btn:hover{border-color:var(--mint);color:var(--mint);}
  .copy-btn.copied{background:var(--mint-dim);border-color:var(--mint);color:var(--mint);}

  /* hashtags */
  .tags-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;margin-top:4px;
  }
  .tags-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .tags-head .section-label{padding:0;}
  .tags-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
  .tag-pill{
    background:var(--mint-dim);border:1px solid rgba(0,217,126,0.25);color:var(--mint);
    font-size:12px;padding:5px 10px;border-radius:999px;font-family:'JetBrains Mono',monospace;
  }

  .empty{
    text-align:center;padding:60px 20px;color:var(--text-faint);font-size:13px;line-height:1.7;
  }
  .empty b{color:var(--text-dim);}

  footer{
    text-align:center;margin-top:30px;font-size:11px;color:var(--text-faint);
    font-family:'JetBrains Mono',monospace;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="brand">
      <div class="brand-mark">TW</div>
      <div class="brand-text">
        <h1>TripWriter</h1>
        <p>GEMINI × PEXELS AUTO BLOG</p>
      </div>
    </div>
    <button class="settings-btn" id="settingsToggle" title="API 키 설정">⚙</button>
  </div>

  <div class="settings" id="settingsPanel">
    <div class="field">
      <label>Gemini API Key</label>
      <input type="password" id="geminiKey" placeholder="AIza...">
      <div class="hint">Google AI Studio에서 발급 → <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a></div>
    </div>
    <div class="field">
      <label>Pexels API Key</label>
      <input type="password" id="pexelsKey" placeholder="563492ad...">
      <div class="hint">무료 즉시발급 → <a href="https://www.pexels.com/api/" target="_blank">pexels.com/api</a> (Trip.com은 브라우저에서 붙는 공개 이미지 API가 없어서 대체함)</div>
    </div>
  </div>

  <div class="input-card">
    <input type="text" id="destInput" placeholder="여행지 입력 (예: 다낭, 후쿠오카, 제주도)">
    <button class="go-btn" id="generateBtn">생성</button>
  </div>

  <div class="status" id="statusLine"></div>

  <div id="results">
    <div class="empty" id="emptyState">
      ⚙ 버튼 눌러서 API 키 먼저 저장하고<br>여행지 입력한 다음 <b>생성</b> 눌러줘 🌏
    </div>
  </div>

  <footer>made for 깡욱 · keys stored locally in your browser only</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const geminiKeyInput = $('geminiKey');
const pexelsKeyInput = $('pexelsKey');
const settingsPanel = $('settingsPanel');
const settingsToggle = $('settingsToggle');
const destInput = $('destInput');
const generateBtn = $('generateBtn');
const statusLine = $('statusLine');
const results = $('results');
const emptyState = $('emptyState');

// load saved keys
geminiKeyInput.value = localStorage.getItem('tw_gemini_key') || '';
pexelsKeyInput.value = localStorage.getItem('tw_pexels_key') || '';
[geminiKeyInput, pexelsKeyInput].forEach(el=>{
  el.addEventListener('change', ()=>{
    localStorage.setItem('tw_gemini_key', geminiKeyInput.value.trim());
    localStorage.setItem('tw_pexels_key', pexelsKeyInput.value.trim());
  });
});
// auto-open settings if no key saved yet
if(!geminiKeyInput.value) settingsPanel.classList.add('open');

settingsToggle.addEventListener('click', ()=> settingsPanel.classList.toggle('open'));

function setStatus(text, isError=false, spinning=false){
  statusLine.className = 'status' + (isError ? ' error' : '');
  statusLine.innerHTML = (spinning ? '<span class="spinner"></span>' : '') + (text||'');
}

async function copyText(text, btn){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  }
  const orig = btn.innerHTML;
  btn.innerHTML = '✓ 복사됨';
  btn.classList.add('copied');
  setTimeout(()=>{ btn.innerHTML = orig; btn.classList.remove('copied'); }, 1400);
}

async function callGemini(apiKey, destination){
  const prompt = `너는 한국어 여행 블로그 작가야. "${destination}"을(를) 주제로 여행 일지 블로그 글을 작성해줘.

요구사항:
- 총 3단계(도입/이동+첫날 체험, 관광지/맛집 등 중간 여정, 마무리+팁)로 구성
- 각 단계는 반드시 한글 기준 1200~1500자 (공백 포함)
- 실제 사람이 쓴 것처럼 자연스러운 구어체 섞어서 ("~했다" 대신 가끔 "~했어요", "~더라고요" 같은 생생한 표현 사용), AI 특유의 상투적 표현(예: "환상적인", "잊지 못할", "매력적인")은 피하고 구체적 디테일 위주로 작성
- 각 단계마다 그 단계 내용을 대표할 사진을 찾기 위한 영어 이미지 검색어(imageQuery)를 2~4단어로 제공 (Pexels 검색용, 예: "danang beach sunset")
- 전체 글 내용에 맞는 한국어 해시태그 10~18개 생성 (# 없이 단어만, 여행지명/음식/명소/감성 키워드 골고루)

아래 JSON 형식으로만 응답해. 코드블록이나 설명 텍스트 없이 순수 JSON만 출력해:
{
  "stages": [
    {"title": "단계 제목", "text": "본문 내용", "imageQuery": "english search keywords"},
    {"title": "단계 제목", "text": "본문 내용", "imageQuery": "english search keywords"},
    {"title": "단계 제목", "text": "본문 내용", "imageQuery": "english search keywords"}
  ],
  "hashtags": ["태그1", "태그2", "..."]
}`;

  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      contents:[{parts:[{text:prompt}]}],
      generationConfig:{ temperature:0.9, maxOutputTokens:8000 }
    })
  });
  if(!res.ok){
    const errBody = await res.text();
    throw new Error(`Gemini API 오류 (${res.status}): ${errBody.slice(0,200)}`);
  }
  const data = await res.json();
  const cand = data.candidates && data.candidates[0];
  if(!cand) throw new Error('Gemini 응답이 비어있어. 프롬프트가 차단됐을 수 있어.');
  let text = cand.content.parts.map(p=>p.text||'').join('');
  text = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){ throw new Error('Gemini가 JSON 형식이 아닌 응답을 줬어. 다시 시도해봐.'); }
  return parsed;
}

async function fetchPexelsImage(apiKey, query){
  if(!apiKey) return null;
  try{
    const res = await fetch(`https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=1&orientation=landscape`, {
      headers:{ Authorization: apiKey }
    });
    if(!res.ok) return null;
    const data = await res.json();
    const photo = data.photos && data.photos[0];
    if(!photo) return null;
    return { url: photo.src.large, page: photo.url };
  }catch(e){ return null; }
}

function renderResults(destination, parsed, images){
  emptyState.style.display = 'none';
  results.innerHTML = '';

  parsed.stages.forEach((stage, i)=>{
    const img = images[i];
    const card = document.createElement('div');
    card.className = 'stage';

    card.innerHTML = `
      <div class="stage-head">
        <div class="stage-head-left">
          <div class="num-badge">${i+1}</div>
          <div class="stage-title">${escapeHtml(stage.title || ('단계 ' + (i+1)))}</div>
        </div>
        <div class="char-count">${(stage.text||'').length.toLocaleString()}자</div>
      </div>
      ${img ? `<img class="stage-img" src="${img.url}" alt="${escapeHtml(stage.imageQuery||'')}">` : `<div class="stage-img"></div>`}
      <div class="img-link-row">
        <input type="text" readonly value="${img ? img.url : '이미지를 찾지 못했어 (Pexels 키 확인 또는 검색어: ' + escapeHtml(stage.imageQuery||'') + ')'}">
        <button class="copy-btn" data-copy="${img ? img.url.replace(/"/g,'&quot;') : ''}">📋 링크</button>
      </div>
      <div class="section-label">본문</div>
      <div class="body-box">${escapeHtml(stage.text||'')}</div>
      <div class="copy-row">
        <button class="copy-btn" data-copy-text="${i}">📋 텍스트 복사</button>
      </div>
    `;
    results.appendChild(card);

    card.querySelectorAll('.copy-btn[data-copy]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const val = btn.getAttribute('data-copy');
        if(val) copyText(val, btn);
      });
    });
    const textBtn = card.querySelector('[data-copy-text]');
    textBtn.addEventListener('click', ()=> copyText(stage.text || '', textBtn));
  });

  const tagsCard = document.createElement('div');
  tagsCard.className = 'tags-card';
  const tagsString = parsed.hashtags.map(t=>'#'+t.replace(/^#/,'')).join(' ');
  tagsCard.innerHTML = `
    <div class="tags-head">
      <div class="section-label">해시태그 (${parsed.hashtags.length}개)</div>
      <button class="copy-btn" id="copyTagsBtn">📋 전체 복사</button>
    </div>
    <div class="tags-wrap">
      ${parsed.hashtags.map(t=>`<span class="tag-pill">#${escapeHtml(t.replace(/^#/,''))}</span>`).join('')}
    </div>
  `;
  results.appendChild(tagsCard);
  tagsCard.querySelector('#copyTagsBtn').addEventListener('click', (e)=> copyText(tagsString, e.currentTarget));
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

generateBtn.addEventListener('click', async ()=>{
  const geminiKey = geminiKeyInput.value.trim();
  const pexelsKey = pexelsKeyInput.value.trim();
  const destination = destInput.value.trim();

  if(!geminiKey){ setStatus('⚠ Gemini API 키를 먼저 입력해줘', true); settingsPanel.classList.add('open'); return; }
  if(!destination){ setStatus('⚠ 여행지를 입력해줘', true); return; }

  generateBtn.disabled = true;
  setStatus('Gemini가 여행 일지 작성 중...', false, true);

  try{
    const parsed = await callGemini(geminiKey, destination);
    if(!parsed.stages || parsed.stages.length === 0) throw new Error('생성된 단계가 없어. 다시 시도해줘.');

    setStatus('Pexels에서 사진 검색 중...', false, true);
    const images = [];
    for(const stage of parsed.stages){
      const img = await fetchPexelsImage(pexelsKey, stage.imageQuery || destination);
      images.push(img);
    }

    renderResults(destination, parsed, images);
    setStatus(`✓ "${destination}" 완료 — ${parsed.stages.length}단계 · ${parsed.hashtags.length}개 태그`);
  }catch(err){
    console.error(err);
    setStatus('✕ ' + err.message, true);
  }finally{
    generateBtn.disabled = false;
  }
});

destInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') generateBtn.click(); });
</script>
</body>
</html>
